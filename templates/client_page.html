<!DOCTYPE html>
<html>
<head>
    <title>{{ client.name }} — Client Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"> <!-- full access to icon set -->
</head>

<body>
<div class="container py-4">

    <h1 class="mb-4">{{ client.name }}</h1>

    <button class="btn btn-secondary mb-3"
            onclick="window.location='/'">
        ← Back to Dashboard
    </button>

    <!-- Program Lists Section -->
    <div class="program-list-section mt-3">

        <div class="d-flex justify-content-between align-items-center mt-3 mb-2 flex-nowrap">
            <h4 class="mb-0">Program Lists</h4>

            <div class="threshold-control d-flex align-items-center gap-2 flex-shrink-0">
                <label for="threshold-slider" class="mb-0">Threshold (%)</label>
                <input id="threshold-slider" type="range" min="0" max="100" value="70"
                    class="form-range" style="width: 200px;">
                <span id="threshold-value" class="ms-1">70%</span>
            </div>
        </div>

        <!-- Add Program List -->
        <div class="d-flex gap-2 mb-2">
            <input type="text" id="pl-name" class="form-control form-control-sm"
                placeholder="New Program List">
            <button class="btn btn-primary btn-sm" onclick="addProgramList({{ client.id }})">
                <i class="bi bi-plus-circle"></i>
            </button>
        </div>

        <!-- Program Lists Container -->
        <div id="program-lists"></div>

    </div>

</div>

<!-- Chart Modal Pop-Up -->
<div class="modal fade" id="chartModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content chart-modal">
      <div class="modal-header">
        <h5 class="modal-title">Selected Targets Chart</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div id="modal-chart" class="chart-container"></div>

        <!-- Threshold control -->
        <div class="threshold-control mt-3 d-flex align-items-center gap-2">
          <label for="modal-threshold" class="mb-0">Threshold (%)</label>
          <input id="modal-threshold" type="range" min="0" max="100" value="80"
                 class="form-range flex-grow-1" style="max-width: 300px;">
          <span id="modal-threshold-value" class="ms-1">80%</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let GLOBAL_THRESHOLD = 80;

// Apply saved dark mode preference
if (localStorage.getItem('darkMode') === 'enabled') {
    $('body').addClass('dark-mode');
}

//////////////////////////////
// SHARED THRESHOLD HANDLER //
//////////////////////////////
function setThreshold(val, updateChart = true) {
    GLOBAL_THRESHOLD = val;
    localStorage.setItem('threshold', val);

    // Update main slider
    $('#threshold-slider').val(val);
    $('#threshold-value').text(val + '%');

    // Update modal slider
    $('#modal-threshold').val(val);
    $('#modal-threshold-value').text(val + '%');

    // If modal is open, update chart threshold line
    if (updateChart && $('#chartModal').hasClass('show')) {
        Plotly.relayout('modal-chart', {
            shapes: [{
                type: 'line',
                x0: 0,
                x1: 1,
                xref: 'paper',
                y0: val,
                y1: val,
                line: { color: 'red', width: 2, dash: 'dash' }
            }],
            annotations: [{
                xref: 'paper',
                x: 1.01,
                y: val,
                xanchor: 'left',
                text: `${val}%`,
                showarrow: false,
                font: { color: 'red' }
            }]
        });
    }
}

///////////////////
// PROGRAM LIST JS 
///////////////////
function addProgramList(clientId) {
    const name = $('#pl-name').val().trim();
    if (!name) return;

    $.post('/add_program_list', { client_id: clientId, name: name }, function() {
        $('#pl-name').val('');
        loadProgramLists(clientId);
    });
}

function loadProgramLists(clientId) {
    $.get('/get_program_lists/' + clientId, function(lists) {
        const container = $('#program-lists');
        container.empty();

        lists.forEach(pl => {
            const plId = pl.id;

            container.append(`
                <div class="card mb-2">

                    <!-- CLICKABLE HEADER -->
                    <div class="card-header d-flex justify-content-between align-items-center program-list-header"
                        data-id="${plId}">

                        <div class="d-flex align-items-center gap-2">
                            <strong>${pl.name}</strong>
                            <span id="pl-arrow-${plId}" class="ms-2">▼</span>
                        </div>

                        <button class="btn btn-danger btn-sm delete-program-list" data-id="${plId}">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>

                    <!-- COLLAPSIBLE BODY -->
                    <div class="card-body" id="pl-body-${plId}" style="display: none;">

                        <!-- Add Program -->
                        <div class="d-flex gap-2 mb-2">
                            <input type="text" id="program-name-${plId}"
                                   class="form-control form-control-sm"
                                   placeholder="New Program">
                            <button class="btn btn-primary btn-sm"
                                    onclick="addProgram(${plId})">
                                <i class="bi bi-plus-circle"></i>
                            </button>
                        </div>

                        <!-- Programs -->
                        <div id="programs-${plId}"></div>

                    </div>
                </div>
            `);

            loadPrograms(plId);
        });
    });
}

function deleteProgramList(plId, clientId) {
    $.post('/delete_program_list/' + plId, function() {
        loadProgramLists(clientId);
    });
}

function toggleProgramList(plId) {
    const body = $('#pl-body-' + plId);
    const arrow = $('#pl-arrow-' + plId);

    body.slideToggle(200);

    if (arrow.text() === '▼') {
        arrow.text('▲');
    } else {
        arrow.text('▼');
    }
}

$(document).on('click', '.delete-program-list', function(event) {
    event.stopPropagation(); // NOW it works
    const id = $(this).data('id');

    if (confirm('Delete this entire program list and all nested programs, targets, and data?')) {
        $.post('/delete_program_list/' + id, function() {
            location.reload();
        });
    }
});

$(document).on('click', '.program-list-header', function() {
    const id = $(this).data('id');
    toggleProgramList(id);
});


///////////////////
// PROGRAM JS
///////////////////
function addProgram(programListId) {
    const name = $('#program-name-' + programListId).val().trim();
    if (!name) return;

    $.post('/add_program', { program_list_id: programListId, name: name }, function() {
        $('#program-name-' + programListId).val('');
        loadPrograms(programListId);
    });
}

function loadPrograms(programListId) {
    $.get('/get_programs/' + programListId, function(programs) {
        const container = $('#programs-' + programListId);
        container.empty();

        programs.forEach(p => {
            const programId = p.id;

            container.append(`
                <div class="program-card card mb-2">

                    <div class="card-header d-flex justify-content-between align-items-center program-header"
                        data-id="${programId}">

                        <div class="d-flex align-items-center gap-2">
                            <strong>${p.name}</strong>
                            <span id="program-arrow-${programId}" class="ms-2">▼</span>
                        </div>

                        <button class="btn btn-danger btn-sm delete-program" data-id="${programId}">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>

                    <div class="program-body" id="program-body-${programId}" style="display:none;">
                        <!-- Add Target -->
                        <div class="d-flex gap-2 mb-2">
                            <input type="text" id="target-name-${programId}"
                                class="form-control form-control-sm"
                                placeholder="New Target">
                            <button class="btn btn-primary btn-sm"
                                    onclick="addTarget(${programId})">
                                <i class="bi bi-plus-circle"></i>
                            </button>
                        </div>

                        <!-- Target List -->
                        <div id="targets-${programId}" class="mb-3"></div>

                        <!-- Plot Button -->
                        <button class="btn btn-success btn-sm mb-2"
                                onclick="plotSelectedTargets(${programId})">
                            Plot Selected
                        </button>
                    </div>

                </div>
            `);
        });
    });
}

function deleteProgram(programId, programListId) {
    $.post('/delete_program/' + programId, function() {
        loadPrograms(programListId);
    });
}

function toggleProgram(programId) {
    const body = $('#program-body-' + programId);
    const arrow = $('#program-arrow-' + programId);

    body.slideToggle(200);

    if (arrow.text() === '▼') {
        arrow.text('▲');
        loadTargets(programId);   // Load Targets when expanding
    } else {
        arrow.text('▼');
    }
}

$(document).on('click', '.delete-program', function(event) {
    event.stopPropagation(); // NOW it works
    const id = $(this).data('id');

    if (confirm('Delete this program and all its targets and data?')) {
        $.post('/delete_program/' + id, function() {
            location.reload();
        });
    }
});

$(document).on('click', '.program-header', function() {
    const id = $(this).data('id');
    toggleProgram(id);
});


///////////////////
// TARGETS JS
///////////////////
function addTarget(programId) {
    const name = $('#target-name-' + programId).val().trim();
    if (!name) return;

    $.post('/add_target', { program_id: programId, name: name }, function() {
        $('#target-name-' + programId).val('');
        loadTargets(programId);
    });
}

function loadTargets(programId) {
    $.get('/get_targets/' + programId, function(targets) {
        const container = $('#targets-' + programId);
        container.empty();

        targets.forEach(t => {
            container.append(`
                <div class="target-card mb-2">

                    <div class="target-header d-flex justify-content-between align-items-center"
                        data-id="${t.id}">

                        <div class="d-flex align-items-center gap-2">
                            <input type="checkbox" class="target-checkbox"
                                data-target-id="${t.id}"
                                onclick="event.stopPropagation();">
                            <strong>${t.name}</strong>
                            <span id="target-arrow-${t.id}" class="ms-2">▼</span>
                        </div>

                        <button class="btn btn-danger btn-sm delete-target"
                                data-id="${t.id}">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>

                    <div class="target-body" id="target-body-${t.id}" style="display:none;">
                        
                        <div class="d-flex flex-wrap align-items-center gap-2">

                            <!-- Add Data Form -->
                            <form class="datapoint-form d-flex align-items-center gap-1 mb-0"
                                onsubmit="addDataPoint(event, ${t.id})">

                                <input type="date" name="date" class="form-control form-control-sm"
                                    required style="max-width: 150px;">
                                <input type="number" step="any" name="value"
                                    class="form-control form-control-sm"
                                    placeholder="Value" required style="max-width: 120px;">
                                <input type="number" step="any" name="total"
                                    class="form-control form-control-sm"
                                    placeholder="Total" required style="max-width: 120px;">
                                <button type="submit" class="btn btn-success btn-sm"><i class="bi bi-plus-circle"></i></button>
                            </form>

                            <!-- CSV Upload Form -->
                            <form class="csv-upload-form d-flex align-items-center gap-1 mb-0"
                                onsubmit="uploadTargetCSV(event, ${t.id})"
                                enctype="multipart/form-data">

                                <input type="file" name="csv_file" accept=".csv"
                                    class="form-control form-control-sm" style="max-width: 250px;" required>
                                <button type="submit" class="btn btn-secondary btn-sm">Upload CSV</button>
                            </form>
                        </div>
                    </div>

                </div>
            `);
        });
    });
}

function deleteTarget(targetId, programId) {
    $.post('/delete_target/' + targetId, function() {
        loadTargets(programId);
    });
}

function toggleTarget(targetId) {
    const body = $('#target-body-' + targetId);
    const arrow = $('#target-arrow-' + targetId);

    body.slideToggle(200);

    if (arrow.text() === '▼') {
        arrow.text('▲');
    } else {
        arrow.text('▼');
    }
}

function plotSelectedTargets(programId) {
    const selected = [];
    $(`#targets-${programId} .target-checkbox:checked`).each(function() {
        selected.push($(this).data('target-id'));
    });

    if (selected.length === 0) {
        alert("Select at least one target to plot.");
        return;
    }

    $.ajax({
        url: '/get_target_data',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ target_ids: selected }),
        success: function(data) {
            const traces = [];
            Object.keys(data).forEach(tid => {
                const t = data[tid];
                traces.push({
                    x: t.dates,
                    y: t.percentages,
                    mode: 'lines+markers',
                    name: t.name
                });
            });

            // Retrieve persistent threshold
            const threshold = parseFloat(localStorage.getItem('threshold')) || 80;
            $('#modal-threshold').val(threshold);
            $('#modal-threshold-value').text(threshold + '%');

            // Plot chart with threshold line
            Plotly.newPlot('modal-chart', traces, {
                title: 'Selected Targets',
                yaxis: { title: '%' },
                height: 500,
                shapes: [{
                    type: 'line',
                    x0: 0,
                    x1: 1,
                    xref: 'paper',
                    y0: threshold,
                    y1: threshold,
                    line: { color: 'red', width: 2, dash: 'dash' }
                }],
                annotations: [{
                    xref: 'paper',
                    x: 1.01,
                    y: threshold,
                    xanchor: 'left',
                    text: `${threshold}%`,
                    showarrow: false,
                    font: { color: 'red' }
                }]
            }, {responsive: true});

            // Show modal
            const modal = new bootstrap.Modal(document.getElementById('chartModal'));
            modal.show();
        }
    });
}

$(document).on('click', '.delete-target', function(event) {
    event.stopPropagation(); // prevent toggle
    const id = $(this).data('id');

    if (confirm('Delete this target and all its datapoints?')) {
        $.post('/delete_target/' + id, function() {
            location.reload();
        });
    }
});

$(document).on('click', '.target-header', function() {
    const id = $(this).data('id');
    toggleTarget(id);
});

// Threshold slider inside modal
$('#modal-threshold').on('input', function () {
    setThreshold(parseFloat(this.value));
    const val = parseFloat(this.value);

    // Update chart line dynamically
    Plotly.relayout('modal-chart', {
        shapes: [{
            type: 'line',
            x0: 0,
            x1: 1,
            xref: 'paper',
            y0: val,
            y1: val,
            line: { color: 'red', width: 2, dash: 'dash' }
        }],
        annotations: [{
            xref: 'paper',
            x: 1.01,
            y: val,
            xanchor: 'left',
            text: `${val}%`,
            showarrow: false,
            font: { color: 'red' }
        }]
    });
});

$('#chartModal').on('shown.bs.modal', function () {
    Plotly.Plots.resize('modal-chart');
});


///////////////////
// DataPoints JS
///////////////////
function addDataPoint(e, targetId) {
    e.preventDefault();

    const form = $(e.target);
    const formData = form.serialize() + '&target_id=' + targetId;

    $.post('/add_datapoint', formData, function() {
        loadDataPoints(targetId);
        form[0].reset();
    });
}

function deleteDataPoint(dpId, targetId) {
    $.post('/delete_datapoint/' + dpId, function() {
        loadDataPoints(targetId);
    });
}

function uploadTargetCSV(e, targetId) {
    e.preventDefault();
    const formData = new FormData(e.target);

    $.ajax({
        url: '/upload_target_csv/' + targetId,
        type: 'POST',
        data: formData,
        processData: false,
        contentType: false,
        success: function(res) {
            alert(`Created: ${res.created}\nUpdated: ${res.updated}`);
            e.target.reset();
        }
    });
}

$(document).ready(function () {

    loadProgramLists({{ client.id }});

    const saved = parseFloat(localStorage.getItem('threshold')) || 80;
    setThreshold(saved, false);

    $('#threshold-slider').on('input', function () {
        setThreshold(parseFloat(this.value));
    });

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
