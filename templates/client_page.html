<!DOCTYPE html>
<html>
<head>
    <title>{{ client.name }} — Client Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
<div class="container py-4">

    <h1 class="mb-4">{{ client.name }}</h1>

    <button class="btn btn-secondary mb-3"
            onclick="window.location='/'">
        ← Back to Dashboard
    </button>

   <!-- Threshold + Upload CSV Row -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
        <div class="threshold-control d-flex align-items-center gap-2">
            <label for="threshold-slider" class="mb-0">Threshold (%)</label>
            <input id="threshold-slider" type="range" min="0" max="100" value="80"
                class="form-range flex-grow-1" style="max-width: 300px;">
            <span id="threshold-value" class="ms-1">80%</span>
        </div>

        <!-- Upload CSV -->
        <form class="csv-upload-form d-flex align-items-center gap-2"
            data-client="{{ client.id }}"
            enctype="multipart/form-data">
            <input type="file" name="file" accept=".csv" class="form-control form-control-sm" required>
            <button type="submit" class="btn btn-secondary btn-sm">Upload CSV</button>
        </form>
    </div>

    <!-- Chart -->
    <div id="chart-{{ client.id }}" class="chart-div mb-4"></div>

    <!-- Add Data Form -->
    <form class="add-data-form d-flex align-items-center gap-2 mt-3 flex-wrap"
        id="add-data-form"
        data-client="{{ client.id }}">
        <input type="date" name="date" class="form-control form-control-sm" required style="max-width: 150px;">
        <input type="number" step="any" name="value" class="form-control form-control-sm" placeholder="Value" required style="max-width: 150px;">
        <input type="number" step="any" name="total" class="form-control form-control-sm" placeholder="Total" required style="max-width: 150px;">
        <button type="submit" class="btn btn-success btn-sm">Add Data</button>
    </form>

</div>

<script>
let GLOBAL_THRESHOLD = 80;

// Apply saved dark mode preference
if (localStorage.getItem('darkMode') === 'enabled') {
    $('body').addClass('dark-mode');
}

$(document).ready(function () {

    ///////// Slider /////////
    // Load saved threshold
    if (localStorage.getItem('threshold')) {
        GLOBAL_THRESHOLD = parseFloat(localStorage.getItem('threshold'));
        $('#threshold-slider').val(GLOBAL_THRESHOLD);
        $('#threshold-value').text(GLOBAL_THRESHOLD + '%');
    }

    // Update threshold live
    $('#threshold-slider').on('input', function () {
        GLOBAL_THRESHOLD = parseFloat(this.value);
        $('#threshold-value').text(GLOBAL_THRESHOLD + '%');
        localStorage.setItem('threshold', GLOBAL_THRESHOLD);

        // Re-render chart
        fetchData({{ client.id }});
    });
    ///////// Slider End /////////


    // set date picker to current date
    const today = new Date().toISOString().split('T')[0];
    $('input[type="date"]').val(today);

    // Load chart immediately
    fetchData({{ client.id }});

    // Add data
    $('#add-data-form').submit(function(e) {
        e.preventDefault();
        const clientId = $(this).data('client');
        const formData = $(this).serialize() + '&client_id=' + clientId;

        $.post('/add_data', formData, function() {
            fetchData(clientId);
        });
    });

    // CSV upload
    $('.csv-upload-form').submit(function(e) {
        e.preventDefault();
        const clientId = $(this).data('client');
        const formData = new FormData(this);

        $.ajax({
            url: '/upload_csv/' + clientId,
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            success: function(res) {
                alert(`Created: ${res.created}\nUpdated: ${res.updated}`);
                fetchData(clientId);
            }
        });
    });

});

// Fetch and plot data
function fetchData(clientId) {
    $.getJSON('/get_data/' + clientId, function(data) {
        const trace = {
            x: data.dates,
            y: data.values,
            type: 'scatter',
            mode: 'lines+markers'
        };

        Plotly.newPlot('chart-' + clientId, [trace], {
            title: '{{ client.name }} Data',
            height: 500,
            yaxis: { title: '%' },
            shapes: [{
                type: 'line',
                x0: 0,
                x1: 1,
                xref: 'paper',
                y0: GLOBAL_THRESHOLD,
                y1: GLOBAL_THRESHOLD,
                line: { color: 'red', width: 2, dash: 'dash' }
            }],
            annotations: [{
                xref: 'paper',
                x: 1.01,
                y: GLOBAL_THRESHOLD,
                xanchor: 'left',
                text: `${GLOBAL_THRESHOLD}%`,
                showarrow: false,
                font: { color: 'red' }
            }]
        });
    });
}

</script>

</body>
</html>
